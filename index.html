<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Product Comparison - Cera's Tiles</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container my-5">
        <h1 class="text-center mb-4">Compare Tiles Products</h1>
        <div class="row mb-4">
            <div class="col-md-5"> <select id="product1" class="form-select">
                    <option value="">Select First Product</option>
                    <option value="glossy">Glossy Wall Tile</option>
                    <option value="matte">Matte Floor Tile</option>
                    <option value="germfree">Germ Free Tile</option>
                </select> </div>
            <div class="col-md-5"> <select id="product2" class="form-select">
                    <option value="">Select Second Product</option>
                    <option value="glossy">Glossy Wall Tile</option>
                    <option value="matte">Matte Floor Tile</option>
                    <option value="germfree">Germ Free Tile</option>
                </select> </div>
            <div class="col-md-2"> <button class="btn btn-primary w-100" onclick="compareProducts()">Compare</button>
            </div>
        </div> <!-- Comparison Result -->
        <div id="comparisonResult"></div>
    </div>
    <script src="script.js"></script>
</body>

</html>
